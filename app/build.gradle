plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

// Version is injected by build-apk.yml (-PappVersionCode / -PappVersionName). Each CI build = +0.1
def vCode = (project.findProperty('appVersionCode') ?: '11').toString().toInteger()
def vName = (project.findProperty('appVersionName') ?: '1.0').toString()

android {
    // compress native libraries inside the APK (the AI library is big; this roughly halves the download)
    packaging { jniLibs { useLegacyPackaging true } }
    packaging { resources { excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*', 'META-INF/INDEX.LIST', 'META-INF/versions/9/OSGI-INF/MANIFEST.MF', 'META-INF/versions/9/OSGI-INF/MANIFEST.MF'] } }
    namespace 'app.orionmd.omniplay'
    compileSdk 35

    defaultConfig {
        applicationId 'app.orionmd.omniplay'
        minSdk 26
        targetSdk 34
        versionCode vCode
        versionName vName
        // phones only (keeps the on-device AI library small)
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
    }

    // Release signing: the OmniPlay keystore (keystore/release.keystore) and its passwords (keystore/keystore.properties,
    // or the same names as environment variables / GitHub Actions secrets). The keystore itself is never packed into the
    // APK — only its certificate fingerprint (Guard.kt), which the app checks at start-up to spot re-signed copies.
    def ksProps = new Properties()
    def ksPropsFile = rootProject.file('keystore/keystore.properties')
    if (ksPropsFile.exists()) ksPropsFile.withInputStream { ksProps.load(it) }
    def ksVal = { String k -> (System.getenv(k) ?: ksProps.getProperty(k) ?: '').trim() }
    def ksFile = rootProject.file('keystore/release.keystore')
    def canSign = ksFile.exists() && !ksVal('KEYSTORE_PASSWORD').isEmpty()
    signingConfigs {
        release {
            if (canSign) {
                storeFile ksFile
                storePassword ksVal('KEYSTORE_PASSWORD')
                keyAlias(ksVal('KEY_ALIAS') ?: 'omniplay')
                keyPassword(ksVal('KEY_PASSWORD') ?: ksVal('KEYSTORE_PASSWORD'))
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig canSign ? signingConfigs.release : signingConfigs.debug
        }
        debug {
            // debug builds are signed with the same key (when present) so the tamper check behaves the same
            if (canSign) signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
        freeCompilerArgs += ['-opt-in=androidx.compose.material3.ExperimentalMaterial3Api', '-opt-in=androidx.compose.foundation.ExperimentalFoundationApi', '-opt-in=androidx.compose.foundation.layout.ExperimentalLayoutApi']
    }
    buildFeatures { compose true; buildConfig true }
    lint { abortOnError false; checkReleaseBuilds false }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation platform('androidx.compose:compose-bom:2025.01.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.media3:media3-exoplayer:1.3.1'
    implementation 'androidx.media3:media3-ui:1.3.1'
    implementation 'androidx.media3:media3-session:1.3.1'
    implementation 'androidx.media3:media3-transformer:1.3.1'
    implementation 'androidx.media3:media3-effect:1.3.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.7'
    implementation 'androidx.work:work-runtime-ktx:2.10.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
    implementation 'sh.calvin.reorderable:reorderable:2.4.3'
    // Gallery stickers: on-device subject segmentation (Google Play services ML Kit)
    implementation 'com.google.android.gms:play-services-mlkit-subject-segmentation:16.0.0-beta1'
    // AI Eraser: MI-GAN inpainting model run on the device
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.20.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20231013'
}
